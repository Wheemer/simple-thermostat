version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: America/St_Johns
    target-branch: master
    labels:
      - dependencies
    commit-message:
      prefix: deps
    open-pull-requests-limit: 10
    groups:
      runtime-dependencies:
        patterns:
          - "@mdi/js"
          - lit
          - squirrelly
      build-tooling:
        patterns:
          - "@rollup/*"
          - rollup
          - "rollup-plugin-*"
          - postcss
          - "postcss-*"
          - typescript
          - tslib
      test-tooling:
        patterns:
          - jest
          - "jest-*"
          - ts-jest
          - "@types/*"
      dev-tooling:
        patterns:
          - concurrently
          - cross-env
          - marked
          - prettier

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/St_Johns
    target-branch: master
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: deps
    groups:
      github-actions:
        patterns:
          - "*"
