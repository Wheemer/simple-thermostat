name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to build and validate
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install and verify
        run: |
          npm ci
          test "v$(node -p "require('./package.json').version")" = "${{ inputs.tag }}"
          npm test -- --runInBand
          npm run typecheck
          npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser layout smoke tests
        run: npm run test:visual

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          files: |
            simple-thermostat.js
            simple-thermostat.debug.js
